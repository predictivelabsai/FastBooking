[project]
name = "foodangels"
version = "0.1.0"
description = "FoodAngels – food delivery platform (FastAPI + FastHTML)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "python-fasthtml>=0.12",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
