[project]
name = "fastbooking"
version = "0.1.0"
description = "FastBooking multi-tenant booking and commerce platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "python-fasthtml>=0.12",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "alembic>=1.15",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "aiosqlite"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402", "F403", "F405"]
