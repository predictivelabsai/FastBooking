services:
  # ── Monolith (API + UI together) ─────────────────────────────────────
  monolith:
    build:
      context: ..
      dockerfile: docker/Dockerfile.monolith
    ports:
      - "8000"
    environment:
      - DEPLOY_MODE=monolith

  # ── API only ─────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000"
    environment:
      - DEPLOY_MODE=api

  # ── UI only (talks to API) ──────────────────────────────────────────
  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    ports:
      - "8001"
    environment:
      - DEPLOY_MODE=ui
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
